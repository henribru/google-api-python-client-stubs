name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Register problem matcher
        run: echo "::add-matcher::.github/workflows/matchers/ruff.json"

      - name: Delete .gitignore (https://github.com/astral-sh/ruff/issues/8753)
        run: rm .gitignore              

      - name: Run ruff format
        run: uv run ruff format --check googleapiclient-stubs apiclient-stubs

  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Delete .gitignore (https://github.com/astral-sh/ruff/issues/8753)
        run: rm .gitignore        

      - name: Run ruff check
        run:  uv run ruff check --output-format github googleapiclient-stubs apiclient-stubs

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Register problem matchers
        run: echo "::add-matcher::.github/workflows/matchers/mypy.json"

      - name: Run Mypy
        run: |
          uv run mypy googleapiclient-stubs apiclient-stubs
